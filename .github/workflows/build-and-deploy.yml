name: CI

# 1
# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the master branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
#2
env:
  REGISTRY: ${{ vars.REGISTRY}}
  IMAGE_NAME: ${{ vars.IMAGE_NAME}}

#3
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo 
        uses: actions/checkout@v2

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          lenght: 6
        
      - run: echo $SHA
        env:
          SHA: ${{ steps.short-sha.outputs.sha }}

      - name: Build container image
        run: docker build -t ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ env.SHA }}  ./code

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 600
      
      - name: Remove all old images
        run: |
            if doctl registry repository list | grep -q "${{ vars.IMAGE_NAME }}"; then 
              TAGS=$(doctl registry repository list-tags ${{ vars.IMAGE_NAME }} --format Tag --no-header)
              if [ ! -z "$TAGS" ]; then
                echo "$TAGS" | xargs -I {} doctl registry repository delete-manifest ${{ vars.IMAGE_NAME }} {} --force
            fi
            else 
              echo "No repository"
            fi

      - name: Push image to DigitalOcean Container Registry
        run: docker push ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ env.SHA }}
        
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    
    steps:
      - name: Deploy to Digital Ocean droplet via SSH action
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: IMAGE_NAME,REGISTRY,{{ secrets.DIGITALOCEAN_ACCESS_TOKEN }},GITHUB_SHA
          script: |
            # Login to registry
            docker login -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} registry.digitalocean.com
            # Stop running container
            docker stop ${{ vars.IMAGE_NAME}}
            # Remove old container
            docker rm ${{ vars.IMAGE_NAME}}
            # Run a new container from a new image
            docker run -d \
            --restart always \
            --name ${{ vars.IMAGE_NAME}} \
            ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ env.SHA }}
