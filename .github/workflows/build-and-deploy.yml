name: docker-ssh-failure-test

on: [push]

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ssh-test .

      - name: Run container (expect SSH failure)
        run: |
          set +e
          docker run --rm ssh-test \
            ssh -vvv \
              -o StrictHostKeyChecking=no \
              -o PasswordAuthentication=no \
              root@${{ secrets.HOST }}
          echo "exit code: $?"
