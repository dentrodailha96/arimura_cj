name: CICD

# 1
# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the master branch
  push:
    branches: [ local-v2, DO ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
#2
env:
  REGISTRY: ${{ vars.REGISTRY}}
  IMAGE_NAME: ${{ vars.IMAGE_NAME}}

#3
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}
    steps:
      - name: Checkout the repo 
        uses: actions/checkout@v4

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 6
        
      - run: echo $SHA
        env:
          SHA: ${{ steps.short-sha.outputs.sha }}

      - name: Build container image
        run: docker build -t ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ steps.short-sha.outputs.sha }}  ./

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
      - name: Log in and push to DigitalOcean Container Registry
        run: |
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} --password-stdin
          docker push ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ steps.short-sha.outputs.sha }}
      - name: Remove all old images
        run: |
          doctl registry repository list-tags ${{ vars.IMAGE_NAME }} \
            --no-header --format Tag \
            | grep -v ${{ steps.short-sha.outputs.sha }} \
            | xargs -r -I {} doctl registry repository delete-tag ${{ vars.IMAGE_NAME }} {} --force || true
            
      - name: Garbage collect registry
        run: |
          doctl registry garbage-collection start --include-untagged-manifests --force
          
          echo "Waiting for garbage collection to complete..."
          while true; do
            GC_JSON=$(doctl registry garbage-collection get-active --output json 2>/dev/null || echo "[]")
            STATUS=$(echo "$GC_JSON" | jq -r 'if length == 0 then "none" else .[0].status end')
            echo "GC status: $STATUS"
            if [ "$STATUS" = "none" ] || [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "failed" ]; then
              echo "GC finished with status: $STATUS"
              break
            fi
            sleep 5
          done
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build_and_push
    
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: 22
          script: |
              whoami
              hostname
      - name: Deploy to Digital Ocean droplet via SSH action
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST}}
          username: ${{ secrets.USERNAME}}
          key: ${{ secrets.SSHKEY}}
          port: 22
          script: |
            # Login to registry
            #docker login -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} registry.digitalocean.com
            echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} --password-stdin
            # Stop running container
            docker stop ${{ vars.IMAGE_NAME }} || true
            # Remove old container
            docker rm ${{ vars.IMAGE_NAME}} || true
            # Clean all old images before pulling new ones
            docker system prune -af 
            # Pull the new image
            docker pull ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ needs.build_and_push.outputs.sha }}
            # Run a new container from a new image
            docker run -d \
            --restart always \
            --name ${{ vars.IMAGE_NAME}} \
            -p 8080:80 \
            ${{ vars.REGISTRY}}/${{ vars.IMAGE_NAME}}:${{ needs.build_and_push.outputs.sha }}
      - name: Checkout
        if: github.ref_name != 'main'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE }}

      - name: Merge branch into main
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout main
          git merge origin/${{ github.ref_name }} --no-ff -m "Auto-merge ${{ github.ref_name }} into main [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE }}
