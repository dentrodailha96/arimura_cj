<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Cliente</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f2;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }

    .wrap { width: 100%; max-width: 480px; }

    h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #1a1a1a;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }

    .tab-btn {
      flex: 1; padding: 10px 8px; font-size: 13px; font-weight: 500;
      border: 0.5px solid #ccc;
      background: #fff;
      color: #666;
      border-radius: 8px;
      cursor: pointer; transition: all 0.15s;
    }
    .tab-btn:hover { background: #f0f0ee; color: #1a1a1a; }
    .tab-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #fff;
      border: 0.5px solid #ddd;
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
    }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: 12px; color: #888;
      margin-bottom: 6px; letter-spacing: 0.04em;
    }
    .field input {
      width: 100%; padding: 9px 12px; font-size: 14px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      background: #f7f7f5;
      color: #1a1a1a;
      outline: none; transition: border 0.15s;
    }
    .field input:focus {
      border-color: #999;
      background: #fff;
    }

    .action-btn {
      width: 100%; padding: 11px; font-size: 14px; font-weight: 500;
      border-radius: 8px; cursor: pointer;
      border: none; margin-top: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:hover { opacity: 0.88; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-new    { background: #1a1a1a; color: #fff; }
    .btn-update { background: #185FA5; color: #fff; }
    .btn-delete { background: #A32D2D; color: #fff; }

    .confirm-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; padding: 1.5rem;
      text-align: center;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-text { color: #fff; font-size: 14px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 8px; width: 100%; }
    .confirm-actions button {
      flex: 1; padding: 9px; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .confirm-yes { background: #A32D2D; color: #fff; }
    .confirm-no  { background: rgba(255,255,255,0.92); color: #111; }

    .feedback-msg {
      display: none; align-items: center; gap: 8px;
      border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-top: 10px;
    }
    .feedback-msg.show { display: flex; }
    .feedback-msg.success { background: #EAF3DE; color: #3B6D11; }
    .feedback-msg.error   { background: #FDECEA; color: #A32D2D; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Controle de Cliente</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('new', this)">+ Novo Cliente</button>
      <button class="tab-btn" onclick="switchTab('update', this)">Editar Cliente</button>
      <button class="tab-btn" onclick="switchTab('delete', this)">Excluir Cliente</button>
    </div>

    <!-- NEW -->
    <div id="panel-new" class="panel active">
      <div class="card">
        <form id="form-new">
          <div class="field">
            <label>Nome</label>
            <input type="text" name="p_nome" placeholder="e.g. Nome Sobrenome" required autocomplete="off">
          </div>
          <div class="field">
            <label>Telefone</label>
            <input type="text" name="p_telephone" placeholder="(XX) XXXXX-XXXX" required autocomplete="off">
          </div>
          <div class="field">
            <label>Endereço</label>
            <input type="text" name="p_address" placeholder="e.g. Rua XXXX" autocomplete="off">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="p_email" placeholder="e.g. xxx@xxxx.com" autocomplete="off">
          </div>
          <button type="submit" class="action-btn btn-new">Adicionar Cliente</button>
        </form>
        <div class="feedback-msg" id="msg-new"></div>
      </div>
    </div>

    <!-- UPDATE -->
    <div id="panel-update" class="panel">
      <div class="card">
        <form id="form-update">
          <div class="field">
            <label>Cliente ID</label>
            <input type="number" name="p_id_client" placeholder="ID do cliente" required autocomplete="off">
          </div>
          <div class="field">
            <label>Nome</label>
            <input type="text" name="p_nome" placeholder="Novo nome" autocomplete="off">
          </div>
          <div class="field">
            <label>Telefone</label>
            <input type="text" name="p_telephone" placeholder="Novo número" autocomplete="off">
          </div>
          <div class="field">
            <label>Endereço</label>
            <input type="text" name="p_address" placeholder="Novo endereço" autocomplete="off">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="p_email" placeholder="Novo Email" autocomplete="off">
          </div>
          <button type="submit" class="action-btn btn-update">Atualizar Cliente</button>
        </form>
        <div class="feedback-msg" id="msg-update"></div>
      </div>
    </div>

    <!-- DELETE -->
    <div id="panel-delete" class="panel">
      <div class="card" style="position: relative;">
        <form id="form-delete">
          <div class="field">
            <label>Cliente ID</label>
            <input type="number" name="p_id_client" placeholder="ID do cliente para excluir" required autocomplete="off">
          </div>
          <button type="submit" class="action-btn btn-delete">Excluir Cliente</button>
        </form>
        <div class="confirm-overlay" id="confirm-box">
          <p class="confirm-text">Tem certeza que deseja excluir este cliente?<br>Esta ação não pode ser desfeita.</p>
          <div class="confirm-actions">
            <button class="confirm-no"  onclick="cancelDelete()">Cancelar</button>
            <button class="confirm-yes" onclick="confirmDelete()">Sim, excluir</button>
          </div>
        </div>
        <div class="feedback-msg" id="msg-delete"></div>
      </div>
    </div>
  </div>


  <script>
    // ── Tab switching ────────────────────────────────────────────────────────
    function switchTab(name, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      btn.classList.add('active');
    }

    // ── Show feedback message ────────────────────────────────────────────────
    function showMsg(id, text, type = 'success') {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'feedback-msg show ' + type;
      setTimeout(() => { el.className = 'feedback-msg'; }, 4000);
    }

    // ── Generic form → Flask fetch helper ────────────────────────────────────
    async function postForm(url, formEl, msgId, submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Aguarde...';
      try {
        const res  = await fetch(url, { method: 'POST', body: new FormData(formEl) });
        const data = await res.json();
        if (data.success) {
          showMsg(msgId, data.message, 'success');
          formEl.reset();
        } else {
          showMsg(msgId, data.error || 'Erro desconhecido.', 'error');
        }
      } catch (err) {
        showMsg(msgId, 'Erro de conexão com o servidor.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtn.dataset.label;
      }
    }

    // ── NEW client ────────────────────────────────────────────────────────────
    const formNew = document.getElementById('form-new');
    const btnNew  = formNew.querySelector('button[type=submit]');
    btnNew.dataset.label = btnNew.textContent;
    formNew.addEventListener('submit', e => {
      e.preventDefault();
      postForm('/clients/insert', formNew, 'msg-new', btnNew);
    });

    // ── UPDATE client ─────────────────────────────────────────────────────────
    const formUpdate = document.getElementById('form-update');
    const btnUpdate  = formUpdate.querySelector('button[type=submit]');
    btnUpdate.dataset.label = btnUpdate.textContent;
    formUpdate.addEventListener('submit', e => {
      e.preventDefault();
      postForm('/clients/update', formUpdate, 'msg-update', btnUpdate);
    });

    // ── DELETE client (with confirmation overlay) ─────────────────────────────
    const formDelete = document.getElementById('form-delete');
    const btnDelete  = formDelete.querySelector('button[type=submit]');
    btnDelete.dataset.label = btnDelete.textContent;
 
    formDelete.addEventListener('submit', e => {
      e.preventDefault();
      document.getElementById('confirm-box').classList.add('show');
    });
 
    function cancelDelete() {
      document.getElementById('confirm-box').classList.remove('show');
    }
 
    function confirmDelete() {
      document.getElementById('confirm-box').classList.remove('show');
      postForm('/clients/delete', formDelete, 'msg-delete', btnDelete);
    }

  </script>
</body>
</html>
